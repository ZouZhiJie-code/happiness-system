<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>板块 7A｜单轨迹透明诊断</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f8f1e7;
        --paper-strong: #eee0cf;
        --ink: #332b25;
        --muted: #77695e;
        --line: rgba(70, 53, 40, 0.18);
        --amber: #ad6d2f;
        --amber-soft: #f0d5b4;
        --red: #9f3f35;
        --green: #49745d;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 8% 8%, rgba(255,255,255,.85), transparent 32rem),
          linear-gradient(145deg, var(--paper), #efe4d6);
      }
      button, textarea, input { font: inherit; }
      button { cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .48; }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(248, 241, 231, .92);
        backdrop-filter: blur(14px);
      }
      .eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
      h1 { margin: 3px 0 0; font: 600 22px/1.25 Georgia, serif; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 11px;
        font-size: 13px;
        background: rgba(255,255,255,.48);
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
      .layout {
        display: grid;
        grid-template-columns: minmax(230px, .7fr) minmax(420px, 1.5fr) minmax(280px, .9fr);
        gap: 16px;
        max-width: 1640px;
        margin: 0 auto;
        padding: 18px;
      }
      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: rgba(255,255,255,.52);
        box-shadow: 0 14px 45px rgba(66, 48, 34, .07);
      }
      .side { padding: 18px; align-self: start; }
      .side h2, .trace h2 { margin: 0 0 14px; font: 600 18px/1.3 Georgia, serif; }
      .label { margin: 17px 0 5px; font-size: 12px; color: var(--muted); }
      .value { margin: 0; white-space: pre-wrap; font-size: 14px; line-height: 1.7; }
      ul { margin: 6px 0 0; padding-left: 19px; }
      li { margin: 5px 0; font-size: 13px; line-height: 1.55; }
      .chat { display: flex; min-height: calc(100vh - 102px); flex-direction: column; overflow: hidden; }
      .chat-head { padding: 17px 19px; border-bottom: 1px solid var(--line); }
      .chat-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .messages { flex: 1; min-height: 420px; max-height: calc(100vh - 330px); overflow-y: auto; padding: 20px; }
      .message { display: flex; margin: 0 0 15px; }
      .message.user { justify-content: flex-end; }
      .bubble {
        max-width: min(78%, 720px);
        border-radius: 17px;
        padding: 12px 14px;
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.72;
      }
      .assistant .bubble { background: rgba(255,255,255,.8); border: 1px solid var(--line); }
      .user .bubble { background: #dcb889; color: #2e241d; }
      .blocked .bubble { border: 1px dashed var(--red); background: #fff3f1; }
      .blocked-tag { display: block; margin-bottom: 7px; color: var(--red); font-size: 12px; font-weight: 700; }
      .empty { margin: 70px auto; max-width: 360px; text-align: center; color: var(--muted); line-height: 1.8; }
      .composer { border-top: 1px solid var(--line); padding: 14px; background: rgba(255,255,255,.35); }
      textarea {
        width: 100%;
        min-height: 92px;
        resize: vertical;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        color: var(--ink);
        background: rgba(255,255,255,.78);
        outline: none;
      }
      textarea:focus, input:focus { border-color: rgba(173,109,47,.65); box-shadow: 0 0 0 3px rgba(173,109,47,.12); }
      .composer-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
      .hint { color: var(--muted); font-size: 12px; }
      .primary, .secondary, .terminal {
        border: 1px solid transparent;
        border-radius: 12px;
        padding: 9px 13px;
      }
      .primary { color: white; background: var(--amber); }
      .secondary { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,.7); }
      .notice { margin: 0 14px 12px; border-radius: 12px; padding: 11px 12px; font-size: 13px; line-height: 1.55; }
      .notice.error { color: #6f261f; background: #f8d9d5; }
      .notice.ok { color: #2f5a43; background: #dcecdf; }
      .trace { padding: 18px; align-self: start; max-height: calc(100vh - 102px); overflow-y: auto; }
      .trace-card { margin: 0 0 12px; border-top: 1px solid var(--line); padding: 13px 0 0; }
      .trace-card:first-of-type { border-top: 0; padding-top: 0; }
      .trace-title { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
      .pill { border-radius: 999px; padding: 3px 8px; color: #5f3c1d; background: var(--amber-soft); font-size: 11px; }
      .trace dl { margin: 8px 0 0; }
      .trace dt { margin-top: 8px; color: var(--muted); font-size: 11px; }
      .trace dd { margin: 2px 0 0; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
      .end { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 17px; }
      .end-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .terminal { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,.72); font-size: 12px; }
      .terminal[data-result="quality_failure"] { color: var(--red); }
      .check { display: flex; align-items: center; gap: 8px; margin: 10px 0; font-size: 13px; }
      .check input { width: 16px; height: 16px; }
      .meta { margin-top: 18px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
      @media (max-width: 1050px) {
        .layout { grid-template-columns: 1fr; }
        .chat { min-height: 70vh; grid-row: 1; }
        .side, .trace { max-height: none; }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="eyebrow">板块 7A · GI-083 · 本机隔离评测</div>
        <h1>【陪我聊】单轨迹透明诊断</h1>
      </div>
      <div class="status"><span class="dot"></span><span id="statusText">读取中</span></div>
    </header>

    <main class="layout">
      <aside class="panel side">
        <h2>本次真实任务</h2>
        <p class="label">希望弄清</p>
        <p class="value" id="goal">—</p>
        <p class="label">已知事实与感受</p>
        <ul id="known"></ul>
        <p class="label">仍然不确定</p>
        <ul id="unknown"></ul>
        <p class="label">表达边界</p>
        <ul id="boundaries"></ul>
        <p class="label">成功标志</p>
        <ul id="success"></ul>
        <p class="meta" id="fingerprints"></p>
      </aside>

      <section class="panel chat">
        <div class="chat-head">
          <strong>自然回答当前 AI</strong>
          <p>每次发送只触发当前轨迹的一次回应。你决定什么时候结束。</p>
        </div>
        <div class="messages" id="messages"></div>
        <div class="notice error" id="errorNotice" hidden></div>
        <div class="notice ok" id="resultNotice" hidden></div>
        <form class="composer" id="composer">
          <textarea id="input" placeholder="写下你准备发给 AI 的话"></textarea>
          <div class="composer-row">
            <span class="hint" id="composerHint">第一段话已按事实卡预填，你可以核对后发送。</span>
            <div>
              <button class="secondary" id="retry" type="button" hidden>手动重试当前轮</button>
              <button class="primary" id="send" type="submit">发送这一轮</button>
            </div>
          </div>
        </form>
      </section>

      <aside class="panel trace">
        <h2>每轮语义结果</h2>
        <div id="traceList"></div>
        <section class="end">
          <strong>由你结束这条轨迹</strong>
          <p class="hint">填写理由后选择一个结果。结束动作不触发模型。</p>
          <textarea id="endReason" placeholder="为什么在这里结束？"></textarea>
          <label class="check"><input id="blocker" type="checkbox" />触发单例阻断</label>
          <textarea id="blockerReason" placeholder="单例阻断原因" hidden></textarea>
          <div class="end-grid">
            <button class="terminal" data-result="value_success" type="button">价值结果</button>
            <button class="terminal" data-result="qualified_pause" type="button">合格暂停</button>
            <button class="terminal" data-result="user_control_exit" type="button">主动结束</button>
            <button class="terminal" data-result="quality_failure" type="button">质量失败</button>
          </div>
        </section>
      </aside>
    </main>

    <script>
      const token = new URLSearchParams(window.location.search).get("token") || "";
      const elements = Object.fromEntries([
        "statusText", "goal", "known", "unknown", "boundaries", "success",
        "fingerprints", "messages", "errorNotice", "resultNotice", "composer",
        "input", "composerHint", "retry", "send", "traceList", "endReason",
        "blocker", "blockerReason"
      ].map((id) => [id, document.getElementById(id)]));
      let currentState = null;
      let inputTouched = false;

      async function api(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: {
            "Content-Type": "application/json",
            "X-Eval-Token": token,
            ...(options.headers || {})
          }
        });
        const value = await response.json();
        if (!response.ok) throw new Error(value.error || `HTTP_${response.status}`);
        return value;
      }

      function setList(element, values) {
        element.replaceChildren();
        if (!values.length) {
          const item = document.createElement("li");
          item.textContent = "留空";
          element.append(item);
          return;
        }
        for (const value of values) {
          const item = document.createElement("li");
          item.textContent = value;
          element.append(item);
        }
      }

      function addMessage(role, content, blocked = false) {
        const row = document.createElement("div");
        row.className = `message ${role}${blocked ? " blocked" : ""}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (blocked) {
          const tag = document.createElement("span");
          tag.className = "blocked-tag";
          tag.textContent = "程序保护拦截的候选回应";
          bubble.append(tag);
        }
        const text = document.createElement("span");
        text.textContent = content;
        bubble.append(text);
        row.append(bubble);
        elements.messages.append(row);
      }

      function renderMessages(state) {
        elements.messages.replaceChildren();
        if (!state.messages.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "核对左侧目标和第一段话，然后开始这条真实轨迹。";
          elements.messages.append(empty);
        }
        for (const message of state.messages) addMessage(message.role, message.content);
        const protectedTurn = [...state.turns].reverse().find((turn) => turn.status === "protected_failure");
        if (protectedTurn && protectedTurn.visibleText) {
          addMessage("assistant", protectedTurn.visibleText, true);
        }
        elements.messages.scrollTop = elements.messages.scrollHeight;
      }

      function renderTrace(state) {
        elements.traceList.replaceChildren();
        const turns = state.turns.filter((turn) => turn.semantic);
        if (!turns.length) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent = "第一轮完成后显示动作、焦点和原话证据。";
          elements.traceList.append(empty);
          return;
        }
        for (const [index, turn] of turns.entries()) {
          const card = document.createElement("article");
          card.className = "trace-card";
          const title = document.createElement("div");
          title.className = "trace-title";
          const name = document.createElement("span");
          name.textContent = `第 ${index + 1} 轮`;
          const action = document.createElement("span");
          action.className = "pill";
          action.textContent = turn.semantic.action;
          title.append(name, action);
          card.append(title);
          const dl = document.createElement("dl");
          const rows = [
            ["当前焦点", turn.semantic.focus],
            ["原话证据", turn.evidenceExcerpts.map((item) => `${item.id}｜${item.content}`).join("\n")],
            ["提问目标", turn.semantic.questionGoal || "—"],
            ["暂停原因", turn.semantic.limitReason || "—"]
          ];
          if (turn.validationIssues.length) rows.push(["保护问题", turn.validationIssues.join("\n")]);
          for (const [label, value] of rows) {
            const dt = document.createElement("dt");
            dt.textContent = label;
            const dd = document.createElement("dd");
            dd.textContent = value;
            dl.append(dt, dd);
          }
          card.append(dl);
          elements.traceList.append(card);
        }
      }

      function render(state) {
        currentState = state;
        const statusLabels = {
          running: "实聊进行中",
          technical_failure: "等待手动重试",
          protected_failure: "程序保护已拦截",
          completed: "轨迹已封存"
        };
        elements.statusText.textContent = statusLabels[state.status] || state.status;
        elements.goal.textContent = state.factCard.evaluatorGoal;
        setList(elements.known, state.factCard.knownFactsAndFeelings);
        setList(elements.unknown, state.factCard.unknownOrUnclear);
        setList(elements.boundaries, state.factCard.boundaries);
        setList(elements.success, state.factCard.successSigns);
        elements.fingerprints.textContent = `候选 ${state.candidateFingerprint.slice(0, 12)}… · 运行 ${state.runFingerprint.slice(0, 12)}…`;
        renderMessages(state);
        renderTrace(state);

        const canSend = state.status === "running" && !state.inFlight;
        elements.send.disabled = !canSend;
        elements.input.disabled = !canSend;
        elements.retry.hidden = state.status !== "technical_failure";
        elements.retry.disabled = state.inFlight;
        document.querySelectorAll(".terminal").forEach((button) => {
          button.disabled = state.status === "completed" || state.inFlight;
        });

        elements.errorNotice.hidden = !state.technicalError && state.status !== "protected_failure";
        elements.errorNotice.textContent = state.status === "protected_failure"
          ? `当前候选输出触发程序保护：${state.lastValidationIssues.join("、")}`
          : state.technicalError
            ? `技术失败：${state.technicalError}。原始失败已经保存，可由你手动重试。`
            : "";
        elements.resultNotice.hidden = state.status !== "completed";
        elements.resultNotice.textContent = state.result
          ? `轨迹已封存：${state.result.resultClass}｜${state.result.reason}`
          : "";

        if (!state.messages.length && !inputTouched) {
          elements.input.value = state.factCard.opening;
        }
        elements.composerHint.textContent = state.messages.length
          ? "请只根据当前对话自然回答。"
          : "第一段话已按事实卡预填，你可以核对后发送。";
      }

      async function refresh() {
        try {
          render(await api("/api/session"));
        } catch (error) {
          elements.statusText.textContent = "读取失败";
          elements.errorNotice.hidden = false;
          elements.errorNotice.textContent = error.message;
        }
      }

      elements.input.addEventListener("input", () => { inputTouched = true; });
      elements.composer.addEventListener("submit", async (event) => {
        event.preventDefault();
        const content = elements.input.value.trim();
        if (!content || !currentState || currentState.inFlight) return;
        elements.send.disabled = true;
        elements.send.textContent = "生成中…";
        try {
          const state = await api("/api/turn", {
            method: "POST",
            body: JSON.stringify({ content })
          });
          elements.input.value = "";
          inputTouched = false;
          render(state);
        } catch (error) {
          elements.errorNotice.hidden = false;
          elements.errorNotice.textContent = error.message;
          await refresh();
        } finally {
          elements.send.textContent = "发送这一轮";
        }
      });

      elements.retry.addEventListener("click", async () => {
        elements.retry.disabled = true;
        try {
          render(await api("/api/retry", { method: "POST", body: "{}" }));
        } catch (error) {
          elements.errorNotice.hidden = false;
          elements.errorNotice.textContent = error.message;
          await refresh();
        }
      });

      elements.blocker.addEventListener("change", () => {
        elements.blockerReason.hidden = !elements.blocker.checked;
        if (!elements.blocker.checked) elements.blockerReason.value = "";
      });

      document.querySelectorAll(".terminal").forEach((button) => {
        button.addEventListener("click", async () => {
          const reason = elements.endReason.value.trim();
          const blockerReason = elements.blockerReason.value.trim();
          if (!reason) {
            window.alert("请先填写结束理由。");
            return;
          }
          if (elements.blocker.checked && !blockerReason) {
            window.alert("请填写单例阻断原因。");
            return;
          }
          if (!window.confirm("确认封存这条轨迹？封存后将停止继续生成。")) return;
          try {
            render(await api("/api/end", {
              method: "POST",
              body: JSON.stringify({
                resultClass: button.dataset.result,
                reason,
                singleCaseBlocker: elements.blocker.checked,
                blockerReason: elements.blocker.checked ? blockerReason : null
              })
            }));
          } catch (error) {
            elements.errorNotice.hidden = false;
            elements.errorNotice.textContent = error.message;
          }
        });
      });

      refresh();
    </script>
  </body>
</html>
