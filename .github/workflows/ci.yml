name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feature/**"
      - "lane/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Run lint
        run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: happiness_system_codex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d happiness_system_codex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DAILY_LIGHT_E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/happiness_system_codex
      DAILY_LIGHT_E2E_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/happiness_system_codex
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare isolated-schema pgvector prerequisite
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d happiness_system_codex -c 'CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public'

      - name: Run zero-model end-to-end regression
        run: npm run test:e2e

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
