packages:
  - "."

# pnpm 11 reads allowBuilds; pnpm 10 and Vercel continue to read the explicit
# onlyBuiltDependencies allowlist. Both lists stay identical by policy.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "sharp"
