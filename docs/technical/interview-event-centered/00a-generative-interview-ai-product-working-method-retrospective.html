  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

.btn:focus-visible {

      const pits = [

        { id: &#x27;P02&#x27;, category: &#x27;语言严谨性&#x27;, title: &#x27;只记录&#x27;, issue: &#x27;记录对象、位置、消费者和生命周期缺失。&#x27;, correction: &#x27;用户追问记录到哪里以及后续处理。&#x27;, fix: &#x27;GI-078、079 明确原话、有效状态、完整提交和恢复。&#x27; },

        { id: &#x27;P04&#x27;, category: &#x27;语言严谨性&#x27;, title: &#x27;展示与再生成混淆&#x27;, issue: &#x27;展示三个版本和最多再生成两次表达混在一起。&#x27;, correction: &#x27;用户要求说明真实用户动作。&#x27;, fix: &#x27;GI-077 将回复版本移出事件中心目标 MVP。&#x27; },

        { id: &#x27;P10&#x27;, category: &#x27;文档治理&#x27;, title: &#x27;板块 4 继承不足&#x27;, issue: &#x27;已冻结的模型主导方向在板块 5 再次偏移。&#x27;, correction: &#x27;用户要求检查文档沉淀和读取。&#x27;, fix: &#x27;固定阅读顺序、唯一 Map、当前专项和上游档案。&#x27; },

        { id: &#x27;P15&#x27;, category: &#x27;文档治理&#x27;, title: &#x27;冻结缺少覆盖关系&#x27;, issue: &#x27;上游变化后早期状态容易继续占据当前口径。&#x27;, correction: &#x27;用户要求以 GI-068～074 重新校准。&#x27;, fix: &#x27;早期决策标历史，新决策明确覆盖与日期。&#x27; }
      ];

      const checks = [
        &#x27;已读取总 Map 并确认当前板块&#x27;,
        &#x27;已复述关闭决策与当前开放问题&#x27;,
        &#x27;本次只聚焦一个高影响选择&#x27;,
        &#x27;已先用具体场景说明体验差异&#x27;,
        &#x27;已区分模型判断与程序边界&#x27;,
        &#x27;已检查上游事实是否唯一决定&#x27;,
        &#x27;候选与冻结结论保持兼容&#x27;,
        &#x27;需要取舍时使用真实选项卡&#x27;,
        &#x27;已准备正常、反例、边界和材料有限案例&#x27;,
        &#x27;已形成下游评测交接与下一动作&#x27;
      ];

      const escapeText = value =&gt; String(value);
      const timelineGrid = root.querySelector(&#x27;#retro-timeline-grid&#x27;);
      const timelineDetail = root.querySelector(&#x27;#retro-timeline-detail&#x27;);
      const pitGrid = root.querySelector(&#x27;#retro-pit-grid&#x27;);
      const pitDetail = root.querySelector(&#x27;#retro-pit-detail&#x27;);
      const pitCount = root.querySelector(&#x27;#retro-pit-count&#x27;);
      const categorySelect = root.querySelector(&#x27;#retro-category&#x27;);
      const checklist = root.querySelector(&#x27;#retro-checklist&#x27;);
      const checkValue = root.querySelector(&#x27;#retro-check-value&#x27;);
      const checkProgress = root.querySelector(&#x27;#retro-check-progress&#x27;);

      function showTimeline(index) {
        const item = timeline[index];
        timelineGrid.querySelectorAll(&#x27;button&#x27;).forEach((button, buttonIndex) =&gt; {
          const active = buttonIndex === index;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
        });
        timelineDetail.replaceChildren();
        const badge = document.createElement(&#x27;span&#x27;);
        badge.className = &#x27;viz-badge&#x27;;
        badge.textContent = escapeText(item.date);
        const title = document.createElement(&#x27;h3&#x27;);
        title.textContent = escapeText(item.title);
        const body = document.createElement(&#x27;p&#x27;);
        body.textContent = escapeText(item.body);
        const result = document.createElement(&#x27;p&#x27;);
        result.className = &#x27;text-muted&#x27;;
        result.textContent = `形成结果：${escapeText(item.result)}`;
        timelineDetail.append(badge, title, body, result);
      }

      timeline.forEach((item, index) =&gt; {
        const button = document.createElement(&#x27;button&#x27;);
        button.type = &#x27;button&#x27;;
        button.className = &#x27;btn&#x27;;
        button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
        button.textContent = `${item.date}｜${item.title}`;
        button.addEventListener(&#x27;click&#x27;, () =&gt; showTimeline(index));
        timelineGrid.appendChild(button);
      });
      showTimeline(0);

      function showPit(item) {
        pitGrid.querySelectorAll(&#x27;button&#x27;).forEach(button =&gt; {
          const active = button.dataset.pitId === item.id;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          button.classList.toggle(&#x27;btn-primary&#x27;, active);
        });
        pitDetail.replaceChildren();
        const heading = document.createElement(&#x27;h3&#x27;);
        heading.textContent = `${item.id}｜${item.title}`;
        const grid = document.createElement(&#x27;div&#x27;);
        grid.className = &#x27;detail-grid&#x27;;
        [
          [&#x27;踩坑&#x27;, item.issue],
          [&#x27;用户纠正&#x27;, item.correction],
          [&#x27;当前处理&#x27;, item.fix],
          [&#x27;归类&#x27;, item.category]
        ].forEach(([label, value]) =&gt; {
          const wrapper = document.createElement(&#x27;div&#x27;);
          const labelNode = document.createElement(&#x27;strong&#x27;);
          labelNode.textContent = label;
          const valueNode = document.createElement(&#x27;p&#x27;);
          valueNode.textContent = value;
          wrapper.append(labelNode, valueNode);
          grid.appendChild(wrapper);
        });
        pitDetail.append(heading, grid);
      }

      function renderPits() {
        const category = categorySelect.value;
        const visible = pits.filter(item =&gt; category === &#x27;all&#x27; || item.category === category);
        pitGrid.replaceChildren();
        pitCount.textContent = `当前显示 ${visible.length} 项`;
        visible.forEach(item =&gt; {
          const button = document.createElement(&#x27;button&#x27;);
          button.type = &#x27;button&#x27;;
          button.className = &#x27;btn&#x27;;
          button.dataset.pitId = item.id;
          button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;);
          button.textContent = `${item.id}｜${item.title}`;
          button.addEventListener(&#x27;click&#x27;, () =&gt; showPit(item));
          pitGrid.appendChild(button);
        });
        if (visible.length) showPit(visible[0]);
      }
      categorySelect.addEventListener(&#x27;change&#x27;, renderPits);
      renderPits();

      checks.forEach((label, index) =&gt; {
        const wrapper = document.createElement(&#x27;label&#x27;);
        wrapper.className = &#x27;form-check&#x27;;
        const input = document.createElement(&#x27;input&#x27;);
        input.className = &#x27;form-check-input&#x27;;
        input.type = &#x27;checkbox&#x27;;
        input.id = `retro-check-${index}`;
        const textNode = document.createElement(&#x27;span&#x27;);
        textNode.className = &#x27;form-check-label&#x27;;
        textNode.textContent = label;
        wrapper.setAttribute(&#x27;for&#x27;, input.id);
        wrapper.append(input, textNode);
        checklist.appendChild(wrapper);
      });

      function updateProgress() {
        const completed = checklist.querySelectorAll(&#x27;input:checked&#x27;).length;
        checkValue.textContent = `${completed} / ${checks.length}`;
        checkProgress.value = completed;
        checkProgress.textContent = `${completed} / ${checks.length}`;
      }
      checklist.addEventListener(&#x27;change&#x27;, updateProgress);
      updateProgress();

      root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const tab = button.dataset.tab;
          root.querySelectorAll(&#x27;[data-tab]&#x27;).forEach(other =&gt; {
            const active = other === button;
            other.setAttribute(&#x27;aria-pressed&#x27;, String(active));
            other.classList.toggle(&#x27;btn-primary&#x27;, active);
          });
          root.querySelectorAll(&#x27;[data-panel]&#x27;).forEach(panel =&gt; {
            panel.hidden = panel.dataset.panel !== tab;
          });
        });
      });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
