<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>GI-088｜评测资产产品审题工作台</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4e3c5;
      --workspace: #f8ead2;
      --content: #fff7e8;
      --sidebar: #e9d1ae;
      --ink: #302114;
      --action: #915b32;
      --action-dark: #70401f;
      --muted: #6b5542;
      --line: #d7b98f;
      --line-strong: #9d7049;
      --success: #37644f;
      --success-soft: #deebdf;
      --warning: #8a5429;
      --warning-soft: #f3dfc0;
      --danger: #8b3c33;
      --danger-soft: #f3d9d2;
      --focus: #225b91;
      --radius-control: 10px;
      --radius-card: 16px;
      --font-display: Baskerville, "Iowan Old Style", "Songti SC", STSong, serif;
      --font-ui: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); font: 15px/1.65 var(--font-ui); }
    button, input, select, textarea { font: inherit; }
    button, select, input[type="radio"] { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--focus) 72%, transparent);
      outline-offset: 2px;
    }
    button {
      min-height: 44px; border: 1px solid var(--line); border-radius: var(--radius-control);
      background: var(--content); color: var(--ink); padding: 9px 14px; font-weight: 650;
    }
    button:hover { border-color: var(--line-strong); }
    button.primary { border-color: var(--action); background: var(--action); color: #fff8eb; }
    button.primary:hover { background: var(--action-dark); }
    button.quiet { min-height: 36px; padding: 6px 10px; background: transparent; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    input[type="search"], select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: var(--radius-control);
      background: #fffaf0; color: var(--ink); padding: 10px 12px;
    }
    textarea { min-height: 92px; resize: vertical; }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2 { font-family: var(--font-display); font-weight: 650; }
    h1 { margin-bottom: 4px; font-size: clamp(24px, 2.2vw, 32px); line-height: 1.2; }
    h2 { margin-bottom: 12px; font-size: 23px; line-height: 1.3; }
    h3 { margin-bottom: 8px; font-size: 16px; line-height: 1.45; }
    .muted { color: var(--muted); }
    .mono { font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    .app-shell {
      min-height: 100vh;
      background: linear-gradient(90deg, rgba(145, 91, 50, .045) 1px, transparent 1px) 0 0 / 28px 28px, var(--canvas);
    }
    .topbar {
      position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: minmax(260px, 1fr) auto;
      gap: 20px; align-items: center; min-height: 92px; padding: 16px 24px; border-bottom: 1px solid var(--line-strong);
      background: color-mix(in srgb, var(--workspace) 96%, transparent); backdrop-filter: blur(14px);
    }
    .title-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .purpose { margin: 0; max-width: 78ch; color: var(--muted); font-size: 13px; }
    .top-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
    .save-status { min-width: 94px; color: var(--muted); font-size: 13px; text-align: right; }
    .private-flag {
      display: inline-flex; align-items: center; min-height: 28px; border: 1px solid var(--line);
      border-radius: 999px; padding: 3px 9px; background: var(--content); color: var(--danger); font-size: 12px; font-weight: 700;
    }
    .progress-track { width: min(240px, 28vw); height: 7px; overflow: hidden; border-radius: 999px; background: #dfc7a6; }
    .progress-track > span {
      display: block; width: 0; height: 100%; border-radius: inherit; background: var(--success); transition: width .18s ease;
    }
    .view-tabs {
      display: flex; min-height: 52px; align-items: end; gap: 4px; padding: 0 24px;
      border-bottom: 1px solid var(--line); background: var(--workspace);
    }
    .view-tab { position: relative; min-width: 96px; border: 0; border-radius: 0; background: transparent; color: var(--muted); }
    .view-tab[aria-selected="true"] { color: var(--ink); }
    .view-tab[aria-selected="true"]::after {
      position: absolute; right: 12px; bottom: -1px; left: 12px; height: 3px; background: var(--action); content: "";
    }
    .review-grid {
      display: grid; grid-template-columns: 276px minmax(440px, 1fr) 372px;
      align-items: start; min-height: calc(100vh - 144px); background: var(--workspace);
    }
    .directory {
      position: sticky; top: 144px; height: calc(100vh - 144px); overflow: hidden;
      border-right: 1px solid var(--line); background: var(--sidebar);
    }
    .directory-controls { display: grid; gap: 8px; padding: 16px; border-bottom: 1px solid var(--line); }
    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .case-list { height: calc(100% - 206px); overflow: auto; scrollbar-gutter: stable; padding: 8px 0 28px; }
    .case-row {
      display: grid; width: 100%; min-height: 74px; grid-template-columns: 12px 1fr; gap: 9px; align-items: start;
      border: 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
      border-radius: 0; background: transparent; padding: 11px 14px; text-align: left;
    }
    .case-row:hover { background: rgba(255, 247, 232, .44); }
    .case-row[aria-current="true"] { background: var(--content); box-shadow: inset 4px 0 0 var(--action); }
    .case-status-dot {
      width: 10px; height: 10px; margin-top: 6px; border: 1px solid var(--line-strong);
      border-radius: 50%; background: transparent;
    }
    .case-status-dot.in-progress { background: var(--warning); }
    .case-status-dot.complete { border-color: var(--success); background: var(--success); }
    .case-row-title { display: block; font-weight: 700; line-height: 1.4; }
    .case-row-meta { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; color: var(--muted); font-size: 11px; }
    .empty-list { padding: 24px 18px; color: var(--muted); }
    .case-content { min-width: 0; padding: 28px clamp(22px, 3vw, 44px) 72px; background: var(--workspace); }
    .case-head { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; margin-bottom: 22px; }
    .case-kicker { margin-bottom: 7px; color: var(--action-dark); font-weight: 750; letter-spacing: .03em; }
    .badges { display: flex; gap: 7px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center; min-height: 28px; border: 1px solid var(--line);
      border-radius: 999px; padding: 3px 9px; background: rgba(255, 247, 232, .68);
      color: var(--muted); font-size: 12px; line-height: 1.3;
    }
    .badge.scope-in { border-color: #92b3a1; background: var(--success-soft); color: var(--success); }
    .badge.scope-out { border-color: #d49e95; background: var(--danger-soft); color: var(--danger); }
    .badge.scope-review { border-color: #d2b17e; background: var(--warning-soft); color: var(--warning); }
    .measurement-chain {
      display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin: 22px 0 28px;
      border: 1px solid var(--line-strong); border-radius: var(--radius-card); background: var(--content); overflow: hidden;
    }
    .chain-step { min-height: 126px; padding: 18px 16px 16px 18px; border-right: 1px solid var(--line); }
    .chain-step:last-child { border-right: 0; }
    .chain-index { display: block; margin-bottom: 10px; color: var(--action); font: 700 12px/1 var(--font-mono); }
    .chain-label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 750; color: var(--muted); }
    .chain-value {
      display: -webkit-box; overflow: hidden; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      font-size: 13px; line-height: 1.55;
    }
    .section { padding: 22px 0; border-top: 1px solid var(--line); }
    .section:first-of-type { border-top: 0; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .section-heading p { margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    .material-block { border-left: 4px solid var(--line-strong); background: var(--content); padding: 17px 18px; }
    .structured-list { display: grid; gap: 12px; margin: 0; }
    .structured-row {
      display: grid; grid-template-columns: minmax(120px, 30%) 1fr; gap: 16px;
      padding-bottom: 11px; border-bottom: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
    }
    .structured-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .structured-key { color: var(--muted); font-size: 13px; font-weight: 700; }
    .structured-value { min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .structured-value ul { margin: 0; padding-left: 20px; }
    .structured-value li + li { margin-top: 5px; }
    details { border-top: 1px solid var(--line); padding: 14px 0; }
    summary { min-height: 44px; cursor: pointer; font-weight: 750; line-height: 44px; }
    .fact-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; border: 1px solid var(--line); background: var(--line); }
    .fact { min-height: 82px; background: var(--content); padding: 14px; }
    .fact-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .fact-value { display: block; font-weight: 700; }
    .fact-note-list { margin: 14px 0 0; padding-left: 20px; color: var(--muted); }
    .decision-panel {
      position: sticky; top: 144px; max-height: calc(100vh - 144px); overflow: auto;
      border-left: 1px solid var(--line); background: var(--content); scrollbar-gutter: stable;
    }
    .decision-inner { padding: 24px 22px 84px; }
    .decision-intro { margin-bottom: 18px; padding-bottom: 15px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
    fieldset { min-width: 0; margin: 0; border: 0; border-top: 1px solid var(--line); padding: 18px 0; }
    fieldset:first-of-type { border-top: 0; }
    legend { padding: 0; font-weight: 750; }
    .field-help { margin: 5px 0 11px; color: var(--muted); font-size: 12px; }
    .choice-list { display: grid; gap: 7px; }
    .choice {
      display: grid; min-height: 44px; grid-template-columns: 20px 1fr; gap: 9px; align-items: center;
      border: 1px solid transparent; border-radius: var(--radius-control); padding: 8px 10px;
    }
    .choice:hover { border-color: var(--line); background: #fffaf0; }
    .choice:has(input:checked) { border-color: var(--line-strong); background: var(--warning-soft); }
    .choice input { width: 18px; height: 18px; margin: 0; accent-color: var(--action); }
    .required-mark, .field-error { color: var(--danger); }
    .field-error { margin: 7px 0 0; font-size: 12px; }
    .decision-actions {
      position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin: 20px -22px -84px; border-top: 1px solid var(--line-strong);
      background: color-mix(in srgb, var(--content) 96%, transparent); padding: 12px 22px 18px; backdrop-filter: blur(10px);
    }
    .summary-view, .compare-view {
      grid-column: 2 / 4; min-height: calc(100vh - 144px); padding: 32px clamp(24px, 4vw, 64px) 80px;
    }
    .summary-view[hidden], .compare-view[hidden], .case-content[hidden], .decision-panel[hidden] { display: none; }
    .summary-lead { max-width: 72ch; color: var(--muted); }
    .summary-progress {
      display: grid; grid-template-columns: minmax(180px, 260px) 1fr; gap: 28px; align-items: center;
      margin: 28px 0; padding: 22px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong);
    }
    .summary-count { font: 650 clamp(44px, 6vw, 72px)/1 var(--font-display); color: var(--action-dark); }
    .summary-count small { font: 600 16px/1.4 var(--font-ui); color: var(--muted); }
    .bar-list { display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: minmax(110px, 180px) 1fr 44px; gap: 12px; align-items: center; }
    .bar { height: 8px; overflow: hidden; border-radius: 999px; background: #dfc7a6; }
    .bar > span { display: block; height: 100%; background: var(--action); }
    .summary-section { margin-top: 32px; }
    .summary-table { width: 100%; border-collapse: collapse; background: var(--content); }
    .summary-table th, .summary-table td { border: 1px solid var(--line); padding: 12px 14px; text-align: left; vertical-align: top; }
    .summary-table th { background: var(--sidebar); }
    .gate-state { font-weight: 750; }
    .gate-state.pending { color: var(--warning); }
    .unresolved-list { margin: 0; padding-left: 22px; }
    .compare-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 24px 0; }
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border: 1px solid var(--line-strong); background: var(--line-strong); }
    .compare-card { min-width: 0; background: var(--content); padding: 22px; }
    .compare-card h3 { font-family: var(--font-display); font-size: 20px; }
    .compare-field { padding: 14px 0; border-top: 1px solid var(--line); }
    .compare-field strong { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .toast {
      position: fixed; right: 22px; bottom: 22px; z-index: 50; max-width: min(420px, calc(100vw - 44px));
      border: 1px solid var(--line-strong); border-radius: var(--radius-control); background: var(--ink);
      color: #fff8eb; padding: 12px 15px; box-shadow: 0 14px 32px rgba(48, 33, 20, .22);
    }
    .toast[hidden] { display: none; }
    @media (max-width: 1180px) {
      .review-grid { grid-template-columns: 236px minmax(0, 1fr); }
      .decision-panel { position: relative; top: auto; grid-column: 2; max-height: none; border-top: 1px solid var(--line-strong); border-left: 0; }
      .summary-view, .compare-view { grid-column: 2; }
      .measurement-chain { grid-template-columns: 1fr; }
      .chain-step { min-height: 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .chain-step:last-child { border-bottom: 0; }
    }
    @media (max-width: 760px) {
      .topbar { position: relative; grid-template-columns: 1fr; padding: 18px; }
      .top-actions { justify-content: flex-start; }
      .save-status { text-align: left; }
      .progress-track { width: 100%; }
      .view-tabs { padding: 0 10px; overflow-x: auto; }
      .review-grid { display: block; }
      .directory { position: relative; top: auto; height: auto; max-height: 46vh; border-right: 0; border-bottom: 1px solid var(--line-strong); }
      .case-list { height: 260px; }
      .case-content, .summary-view, .compare-view { padding: 24px 18px 64px; }
      .decision-panel { grid-column: auto; }
      .case-head, .summary-progress { grid-template-columns: 1fr; display: grid; }
      .fact-grid, .compare-controls, .compare-grid { grid-template-columns: 1fr; }
      .structured-row { grid-template-columns: 1fr; gap: 4px; }
      .top-actions button { flex: 1 1 140px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
    @media (prefers-reduced-transparency: reduce) { .topbar, .decision-actions { background: var(--workspace); backdrop-filter: none; } }
    @media (prefers-contrast: more) { :root { --line: #8f6a48; --line-strong: #54371f; --muted: #4d3827; } }
    @media print {
      .topbar, .view-tabs, .directory, .decision-actions, .toast { display: none !important; }
      .review-grid { display: block; }
      .case-content, .decision-panel, .summary-view, .compare-view { padding: 0; border: 0; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="title-line">
          <h1>GI-088 评测资产审题台</h1>
          <span class="private-flag">本机私有</span>
        </div>
        <p class="purpose">检查题目是否真实、清楚、可复现、可稳定判断，并适合承担当前证据职责。候选、Judge、准入和发布继续等待独立证据。</p>
      </div>
      <div class="top-actions">
        <span id="saveStatus" class="save-status" role="status">尚未修改</span>
        <div class="progress-track" aria-label="评审进度"><span id="topProgressBar"></span></div>
        <span id="topProgressText" class="mono">0 / 70</span>
        <button id="importButton" type="button">导入草稿</button>
        <button id="draftButton" type="button">导出草稿</button>
        <button id="finalButton" class="primary" type="button">完成并导出</button>
      </div>
    </header>
    <nav class="view-tabs" aria-label="工作台视图">
      <button class="view-tab" type="button" data-view="review" aria-selected="true">逐题审查</button>
      <button class="view-tab" type="button" data-view="summary" aria-selected="false">覆盖与进度</button>
      <button class="view-tab" type="button" data-view="compare" aria-selected="false">两题对比</button>
    </nav>
    <div class="review-grid">
      <aside class="directory" aria-label="评测资产目录">
        <div class="directory-controls">
          <label><span class="sr-only">搜索题目</span><input id="searchInput" type="search" placeholder="搜索编号、标题或考点"></label>
          <div class="filter-grid">
            <label><span class="sr-only">资产类型</span><select id="groupFilter">
              <option value="all">全部资产</option><option value="hard_boundary">底线 24</option>
              <option value="development">开发 28</option><option value="hidden_v2">隐藏 v2</option>
              <option value="preview_4_plus_2">4＋2 Preview</option>
            </select></label>
            <label><span class="sr-only">评审状态</span><select id="statusFilter">
              <option value="all">全部状态</option><option value="unreviewed">待审</option>
              <option value="in_progress">审阅中</option><option value="complete">已完成</option>
            </select></label>
            <label><span class="sr-only">当前范围</span><select id="scopeFilter">
              <option value="all">全部范围</option><option value="in_scope">陪我聊</option>
              <option value="out_of_scope">范围外</option><option value="needs_review">待判断</option>
            </select></label>
            <label><span class="sr-only">风险等级</span><select id="riskFilter">
              <option value="all">全部风险</option><option value="P0">P0</option>
              <option value="P1">P1</option><option value="other">其他／待确认</option>
            </select></label>
          </div>
          <button id="nextIncompleteButton" class="quiet" type="button">定位下一项未完成</button>
        </div>
        <div id="caseList" class="case-list"></div>
      </aside>
      <main id="caseContent" class="case-content" tabindex="-1"></main>
      <aside id="decisionPanel" class="decision-panel" aria-label="产品负责人裁决"></aside>
      <section id="summaryView" class="summary-view" hidden></section>
      <section id="compareView" class="compare-view" hidden></section>
    </div>
  </div>
  <input id="fileInput" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
    const packet = __GI088_REVIEW_PACKET__;
    const storageKey = "daily-light:gi088-evaluation-asset-review:" + packet.reviewPacketFingerprint;
    const fieldNames = {
      startingState: "开始状态", priorUserMaterial: "此前用户材料", priorKnownMaterial: "此前已知材料",
      interactionProtocol: "自然互动规则", currentUserInput: "当前用户表达", currentUserSubmission: "当前用户提交",
      openingUserInput: "自然开场", openingUserMaterial: "自然开场材料", scriptedUserSteps: "脚本化用户步骤",
      scriptedUserTurns: "脚本化用户轮次", userSteps: "用户步骤", evaluationTarget: "评测目标",
      executionForm: "执行方式", injectedFailure: "注入故障", desiredOutcome: "用户希望获得的结果",
      minimumJudgePayload: "最小评审材料", requiredJournalSources: "日志必须使用的来源", excludedMaterial: "必须排除的材料",
      scene: "用户场景", userGoal: "用户目标", minimumContext: "必要语境", historicalGoldLabel: "历史标签",
      expectedBehavior: "预期行为", requiredEvidence: "必要证据", prohibitedBehaviors: "不可接受行为",
      blockerPolicy: "阻断规则", sourceClass: "来源类型", privacyLevel: "隐私级别",
      authorizationStatus: "授权状态", semanticLineageKey: "语义血缘", source: "来源", lineage: "案例血缘", whyAdded: "加入原因"
    };
    const labels = {
      assetGroup: {
        hard_boundary: "必须守住的底线", development: "开发问题集",
        hidden_v2: "隐藏 v2 审题材料", preview_4_plus_2: "4＋2 真人 Preview 蓝图"
      },
      layer: {
        bottom_line: "底线", local_action: "局部动作",
        complete_trajectory: "完整轨迹", user_experience: "用户体验"
      },
      mode: { chat: "陪我聊", capture: "帮我记", mixed: "跨模式", unspecified: "待确认" },
      scope: { in_scope: "当前范围", out_of_scope: "范围外", needs_review: "待判断" },
      disposition: {
        keep_current_role: "保留当前定位", revise_then_keep: "修改后保留",
        development_exploration: "转为开发探索", upgrade_to_complete_trajectory: "升级为完整轨迹",

        "</div></section>" +
        '<section class="summary-section"><h3>待处理产品判断</h3>' +
        (unresolved.length
          ? '<ul class="unresolved-list">' + unresolved.map(function(item) {
              const answer = state.answers[item.reviewItemId];
              return "<li><strong>" + escapeHtml(item.reviewItemId + "｜" + item.title) + "</strong>：" +
                escapeHtml(labels.disposition[answer.finalDisposition] || answer.finalDisposition) +
                (answer.reason ? "｜" + escapeHtml(answer.reason) : "") + "</li>";
            }).join("") + "</ul>"
          : '<p class="muted">当前还没有形成需要升级、退出或等待产品规则的裁决。</p>') + "</section>";
    }
    function compareField(label, value) {
      return '<div class="compare-field"><strong>' + escapeHtml(label) + "</strong>" + renderValue(value) + "</div>";
    }
    function compareCard(item) {
      return '<article class="compare-card"><p class="case-kicker">' + escapeHtml(item.assetLabel) + '</p><h3>' +
        escapeHtml(item.reviewItemId + "｜" + item.title) + '</h3><div class="badges"><span class="badge ' +
        scopeBadgeClass(item.currentScopeSignal) + '">' + escapeHtml(labels.scope[item.currentScopeSignal]) +
        '</span><span class="badge">' + escapeHtml(labels.layer[item.evidenceLayer]) + "</span></div>" +
        compareField("用户场景", item.scene) + compareField("主要考点", item.constructUnderTest) +
        compareField("实际材料", item.actualMaterial) + compareField("允许表现", item.allowedOutcomeRange) +
        compareField("失败表现", item.prohibitedBehaviors) + compareField("来源与血缘", { source: item.source, lineage: item.lineage }) + "</article>";
    }
    function renderCompare() {
      const options = packet.items.map(function(item) {
        return '<option value="' + escapeHtml(item.reviewItemId) + '">' + escapeHtml(item.reviewItemId + "｜" + item.title) + "</option>";
      }).join("");
      const itemA = packet.items.find(function(item) { return item.reviewItemId === state.compareA; }) || packet.items[0];
      const itemB = packet.items.find(function(item) { return item.reviewItemId === state.compareB; }) || packet.items[1];
      document.getElementById("compareView").innerHTML = "<h2>两题对比</h2>" +
        '<p class="summary-lead">并排检查重复、近义泄漏、判尺冲突，以及反事实是否真正只改变一个变量。</p>' +
        '<div class="compare-controls"><label>题目 A<select id="compareA">' + options + '</select></label>' +
        '<label>题目 B<select id="compareB">' + options + '</select></label></div>' +
        '<div class="compare-grid">' + compareCard(itemA) + compareCard(itemB) + "</div>";
      document.getElementById("compareA").value = itemA.reviewItemId;
      document.getElementById("compareB").value = itemB.reviewItemId;
      document.getElementById("compareA").addEventListener("change", function(event) { state.compareA = event.target.value; persist("对比选择已保存"); renderCompare(); });
      document.getElementById("compareB").addEventListener("change", function(event) { state.compareB = event.target.value; persist("对比选择已保存"); renderCompare(); });
    }
    function setView(view) {
      state.view = view;
      document.querySelectorAll(".view-tab").forEach(function(tab) { tab.setAttribute("aria-selected", String(tab.dataset.view === view)); });
      document.getElementById("caseContent").hidden = view !== "review";
      document.getElementById("decisionPanel").hidden = view !== "review";
      document.getElementById("summaryView").hidden = view !== "summary";
      document.getElementById("compareView").hidden = view !== "compare";
      localStorage.setItem(storageKey, JSON.stringify(state));
    }
    function renderAll() {
      document.getElementById("searchInput").value = state.filters.search;
      document.getElementById("groupFilter").value = state.filters.group;
      document.getElementById("statusFilter").value = state.filters.status;
      document.getElementById("scopeFilter").value = state.filters.scope;
      document.getElementById("riskFilter").value = state.filters.risk;
      renderCaseList(); renderCaseContent(); renderDecisionPanel(); renderSummary(); renderCompare(); setView(state.view); updateProgress();
    }
    function downloadFile(filename, content, type) {
      const blob = new Blob([content], { type: type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url; link.download = filename; link.click(); URL.revokeObjectURL(url);
    }
    async function sha256Text(value) {
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(value));
      return Array.from(new Uint8Array(digest)).map(function(byte) { return byte.toString(16).padStart(2, "0"); }).join("");
    }
    function decisionDocument(status) {
      return {
        schemaVersion: "1.0", packageVersion: packet.packageVersion,
        reviewPacketFingerprint: packet.reviewPacketFingerprint, status: status,
        reviewerRole: "product_owner", updatedAt: new Date().toISOString(),
        answers: state.answers, revisions: state.revisions
      };
    }
    async function exportDraft() {
      const documentValue = decisionDocument("draft");
      documentValue.decisionLedgerFingerprint = await sha256Text(JSON.stringify(canonicalize(documentValue)));
      downloadFile("gi088-evaluation-asset-review-draft.json", JSON.stringify(documentValue, null, 2) + "\n", "application/json");
      showToast("评审草稿已导出。");
    }
    function finalValidation() {
      return packet.items.map(function(item) { return { item: item, missing: validateAnswer(answerFor(item.reviewItemId)) }; })
        .filter(function(entry) { return entry.missing.length > 0; });
    }
    function buildMarkdown(documentValue) {
      const counts = {};
      packet.items.forEach(function(item) {
        const answer = documentValue.answers[item.reviewItemId] || {};
        if (answer.finalDisposition) counts[answer.finalDisposition] = (counts[answer.finalDisposition] || 0) + 1;
      });
      const lines = [
        "# GI-088 评测资产产品负责人审题结果", "",
        "- 评审包：" + packet.packageVersion,
        "- 评审包指纹：" + packet.reviewPacketFingerprint,
        "- 完成时间：" + documentValue.updatedAt,
        "- 评审数量：" + packet.items.length + " / " + packet.items.length,
        "", "## 裁决分布", ""
      ];
      dispositionOptions.forEach(function(option) { lines.push("- " + option[1] + "：" + (counts[option[0]] || 0)); });
      packet.assetSummaries.forEach(function(asset) {
        lines.push("", "## " + asset.label, "");
        packet.items.filter(function(item) { return item.assetGroup === asset.assetGroup; }).forEach(function(item) {
          const answer = documentValue.answers[item.reviewItemId];
          lines.push(
            "### " + item.reviewItemId + "｜" + item.title, "",
            "- 原案例：" + item.sourceCaseId,
            "- 裁决：" + labels.disposition[answer.finalDisposition],
            "- 当前范围：" + answer.scopeFit,
            "- 语境：" + answer.contextSufficient,
            "- 考点：" + answer.constructClear,
            "- 证据层：" + answer.evidenceLayerValid,
            "- 理由：" + (answer.reason || "结构化判断即裁决依据"),
            "- 修改要求：" + (answer.requestedChange || "无"), ""
          );
        });
      });
      lines.push(
        "## 结论边界", "",
        "本结果只支持评测题目资产的保留、修改、降级、升级、退出和产品规则决策。候选质量、Judge 资格、独立准入、真人 Preview 和发布资格继续等待独立证据。", ""
      );
      return lines.join("\n");
    }
    async function exportFinal() {
      const incomplete = finalValidation();
      if (incomplete.length) {
        state.currentId = incomplete[0].item.reviewItemId; state.view = "review"; persist("已定位未完成题目"); renderAll();
        showToast("还有 " + incomplete.length + " 项未完成，已定位到第一项。"); return;
      }
      const documentValue = decisionDocument("complete");
      documentValue.decisionLedgerFingerprint = await sha256Text(JSON.stringify(canonicalize(documentValue)));
      downloadFile("gi088-evaluation-asset-review-decisions-v1.json", JSON.stringify(documentValue, null, 2) + "\n", "application/json");
      downloadFile("gi088-evaluation-asset-review-summary-v1.md", buildMarkdown(documentValue), "text/markdown");
      showToast("正式 JSON 与 Markdown 总结已导出。");
    }
    async function importDraft(file) {
      const imported = JSON.parse(await file.text());
      if (imported.reviewPacketFingerprint !== packet.reviewPacketFingerprint) throw new Error("评审包指纹不一致。请选择当前 70 项评审包导出的草稿。");
      if (!imported.answers || typeof imported.answers !== "object") throw new Error("草稿缺少逐题裁决。");
      state.answers = imported.answers; state.revisions = imported.revisions || {}; persist("草稿已导入"); renderAll(); showToast("草稿已导入。");
    }
    document.querySelectorAll(".view-tab").forEach(function(tab) { tab.addEventListener("click", function() { setView(tab.dataset.view); }); });
    ["searchInput", "groupFilter", "statusFilter", "scopeFilter", "riskFilter"].forEach(function(id) {
      const element = document.getElementById(id);
      element.addEventListener(id === "searchInput" ? "input" : "change", function() {
        const key = { searchInput: "search", groupFilter: "group", statusFilter: "status", scopeFilter: "scope", riskFilter: "risk" }[id];
        state.filters[key] = element.value; persist("筛选已保存"); renderCaseList();
      });
    });
    document.getElementById("nextIncompleteButton").addEventListener("click", function() {
      const item = packet.items.find(function(entry) { return answerStatus(entry.reviewItemId) !== "complete"; });
      if (!item) { showToast("70 项已经全部完成。"); return; }
      state.currentId = item.reviewItemId; state.view = "review"; persist("已定位未完成题目"); renderAll();
    });
    document.getElementById("importButton").addEventListener("click", function() { document.getElementById("fileInput").click(); });
    document.getElementById("fileInput").addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (!file) return;
      importDraft(file).catch(function(error) { showToast(error instanceof Error ? error.message : String(error)); });
      event.target.value = "";
    });
    document.getElementById("draftButton").addEventListener("click", function() { exportDraft().catch(function(error) { showToast(String(error)); }); });
    document.getElementById("finalButton").addEventListener("click", function() { exportFinal().catch(function(error) { showToast(String(error)); }); });
    document.addEventListener("keydown", function(event) {
      const target = event.target;
      const editing = target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName);
      if (event.key === "/" && !editing) { event.preventDefault(); document.getElementById("searchInput").focus(); }
      if (state.view === "review" && !editing && event.key === "ArrowLeft") { event.preventDefault(); moveCase(-1); }
      if (state.view === "review" && !editing && event.key === "ArrowRight") { event.preventDefault(); moveCase(1); }
    });
    renderAll();
  </script>
</body>
</html>
