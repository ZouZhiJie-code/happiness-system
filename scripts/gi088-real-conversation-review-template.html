<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none';">
  <title>GI-088 真实对话证据审题包 v2</title>
  <style>
    :root{color-scheme:light;--bone:#f3f0e8;--paper:#fffdf8;--ink:#17211d;--muted:#63706a;--line:#d8d8cf;--sage:#315c4b;--sage-soft:#dce9e2;--steel:#3f5665;--steel-soft:#e4ebef;--gold:#8a641d;--gold-soft:#f4e8c8;--danger:#963e34;--danger-soft:#f6dfdc;--shadow:0 20px 54px rgba(22,33,29,.09);--radius:16px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bone);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.78rem;overflow-wrap:anywhere}.app{min-height:100vh;display:grid;grid-template-rows:auto auto 1fr}
    .top{background:var(--ink);color:#f7f4ec;padding:18px 24px;display:flex;align-items:center;gap:20px;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px}.seal{width:44px;height:44px;border:1px solid rgba(255,255,255,.38);border-radius:50%;display:grid;place-items:center;font-size:.74rem;letter-spacing:.08em}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-family:ui-monospace,monospace;font-size:.68rem;color:#b7c6be}.brand h1{font-size:1.24rem;margin:4px 0 0;font-weight:600}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:var(--paper);padding:9px 12px;border-radius:10px;font-size:.86rem}.top .btn{border-color:rgba(255,255,255,.3);background:transparent;color:white}.btn.primary{background:var(--sage);border-color:var(--sage);color:white}.btn:focus-visible,.tab:focus-visible,.case-row:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #e1aa3e;outline-offset:2px}
    .truth{display:grid;grid-template-columns:minmax(270px,1.4fr) repeat(4,minmax(115px,.55fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.truth>div{background:var(--paper);padding:14px 18px}.truth strong{font-size:1.5rem;display:block}.truth small{display:block;color:var(--muted);margin-top:3px;line-height:1.35}.truth .warning{background:var(--gold-soft)}
    .tabs{display:flex;gap:6px;padding:12px 18px;background:var(--paper);border-bottom:1px solid var(--line)}.tab{border:0;background:transparent;padding:9px 13px;border-radius:999px;color:var(--muted)}.tab.active{background:var(--ink);color:white}.workspace{min-height:0;display:grid;grid-template-columns:300px minmax(430px,1fr) 360px}.list-panel,.review-panel{background:var(--paper);min-height:0;overflow:auto}.list-panel{border-right:1px solid var(--line)}.review-panel{border-left:1px solid var(--line)}.list-tools{padding:14px;position:sticky;top:0;background:rgba(255,253,248,.96);backdrop-filter:blur(8px);z-index:3;border-bottom:1px solid var(--line)}.search{width:100%;border:1px solid var(--line);background:white;border-radius:10px;padding:10px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.filters select{width:100%;border:1px solid var(--line);background:white;border-radius:9px;padding:8px;font-size:.8rem}.case-list{padding:8px}.case-row{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:12px;margin-bottom:5px;display:grid;gap:6px}.case-row:hover{background:#f1f3ef}.case-row.active{border-color:#9ab0a5;background:var(--sage-soft)}.case-top{display:flex;align-items:center;gap:8px;justify-content:space-between}.case-id{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted)}.case-title{font-size:.93rem;line-height:1.35}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-family:ui-monospace,monospace;font-size:.66rem;padding:3px 6px;border-radius:999px;background:var(--steel-soft);color:var(--steel)}.chip.gold{background:var(--gold-soft);color:var(--gold)}.chip.blocked{background:var(--danger-soft);color:var(--danger)}.done-dot{width:8px;height:8px;border-radius:50%;background:#b9beb9}.done-dot.done{background:#2e7555}
    .evidence{min-height:0;overflow:auto;padding:26px clamp(20px,3vw,46px) 60px}.evidence-header{max-width:820px;margin:auto}.kicker{color:var(--sage);font-family:ui-monospace,monospace;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase}.evidence h2{font-size:clamp(1.5rem,2.3vw,2.25rem);font-weight:500;line-height:1.16;margin:8px 0 12px}.status-line{display:flex;gap:8px;flex-wrap:wrap}.notice{max-width:820px;margin:18px auto;padding:13px 15px;border:1px solid #d9c78d;border-radius:12px;background:var(--gold-soft);font-size:.88rem;line-height:1.6}.transcript{max-width:820px;margin:24px auto;position:relative}.transcript:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}.message{position:relative;width:calc(50% - 24px);margin:0 0 22px;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:white;box-shadow:0 7px 18px rgba(22,33,29,.045);line-height:1.7;white-space:pre-wrap}.message:after{content:"";position:absolute;top:20px;width:9px;height:9px;border-radius:50%;background:var(--line);border:4px solid var(--bone)}.message.user{margin-right:auto}.message.user:after{right:-33px}.message.assistant{margin-left:auto;background:var(--steel-soft)}.message.assistant:after{left:-33px;background:var(--steel)}.message.target{border:2px solid var(--sage);background:var(--sage-soft);box-shadow:0 0 0 5px rgba(49,92,75,.07),var(--shadow)}.message.target:before{content:"本题要评的 AI 回答";display:block;font-family:ui-monospace,monospace;font-size:.7rem;color:var(--sage);letter-spacing:.06em;margin-bottom:6px}.speaker{font-family:ui-monospace,monospace;font-size:.67rem;color:var(--muted);margin-bottom:5px}.evidence-grid{max-width:820px;margin:28px auto;display:grid;grid-template-columns:1fr 1fr;gap:12px}.evidence-card{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:16px}.evidence-card.wide{grid-column:1/-1}.evidence-card h3{margin:0 0 10px;font-size:.92rem}.evidence-card p,.evidence-card li{font-size:.84rem;line-height:1.65;margin:6px 0}.evidence-card ul{padding-left:18px}.label-value{font-size:1.05rem;color:var(--danger);font-weight:700}.source-row{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.78rem}.source-row:last-child{border-bottom:0}.source-row span:first-child{color:var(--muted)}
    .review-panel{padding:18px}.review-panel h3{margin:0 0 5px;font-size:1.05rem}.review-panel>p{margin:0 0 15px;color:var(--muted);font-size:.82rem;line-height:1.5}.question{padding:13px 0;border-top:1px solid var(--line)}.question legend{font-size:.86rem;font-weight:700;padding:0;margin:0 0 8px}.radio-grid{display:flex;gap:6px;flex-wrap:wrap}.radio-grid label{font-size:.77rem;border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:white}.radio-grid input{margin:0 4px 0 0;vertical-align:-1px}.field{margin-top:12px}.field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px}.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white}.field textarea{min-height:88px;resize:vertical;line-height:1.5}.savebar{position:sticky;bottom:0;margin:16px -18px -18px;padding:12px 18px;background:rgba(255,253,248,.96);border-top:1px solid var(--line);display:flex;gap:8px}.savebar .btn{flex:1}.progress{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted);margin-left:auto}
    .nonreview{max-width:900px;margin:0 auto;padding:6px}.nonreview .item{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:16px;margin:10px 0}.nonreview h3{margin:0 0 8px;font-size:1rem}.missing{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.missing span{background:var(--danger-soft);color:var(--danger);border-radius:999px;padding:4px 8px;font-size:.72rem}.empty{padding:40px;text-align:center;color:var(--muted)}#toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:white;border-radius:10px;padding:10px 14px;opacity:0;pointer-events:none;transition:.18s}#toast.show{opacity:1}.hidden{display:none!important}
    .compare-drawer{position:fixed;inset:0;z-index:15;background:rgba(17,26,22,.62);display:grid;place-items:center;padding:24px}.compare-sheet{width:min(1040px,100%);max-height:90vh;overflow:auto;background:var(--bone);border-radius:18px;box-shadow:var(--shadow);padding:20px}.compare-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.compare-head h2{margin:0;font-size:1.25rem}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare-card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}.compare-card h3{margin:7px 0 12px}.compare-answer{white-space:pre-wrap;line-height:1.65;background:var(--sage-soft);border-left:4px solid var(--sage);padding:12px;border-radius:8px}.compare-card p{font-size:.82rem;line-height:1.55}.compare-empty{grid-column:1/-1;padding:36px;text-align:center;color:var(--muted)}
    @media(max-width:1180px){.workspace{grid-template-columns:260px 1fr}.review-panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0 22px}.review-panel>h3,.review-panel>p,.savebar{grid-column:1/-1}.truth{grid-template-columns:1.5fr repeat(2,1fr)}.truth>div:nth-child(4),.truth>div:nth-child(5){display:none}}
    @media(max-width:760px){.top{align-items:flex-start;flex-direction:column}.truth{grid-template-columns:1fr 1fr}.truth .warning{grid-column:1/-1}.workspace{display:block}.list-panel{border-right:0;max-height:320px}.review-panel{display:block}.message{width:calc(100% - 28px)}.message.user{margin-right:28px}.message.assistant{margin-left:28px}.transcript:before{left:14px}.message:after{display:none}.evidence-grid,.compare-grid{grid-template-columns:1fr}.evidence-card.wide{grid-column:auto}.tabs{overflow:auto}.top-actions{justify-content:flex-start}}
    @media(prefers-contrast:more){:root{--line:#606762}.case-row.active,.message.target{outline:3px solid var(--ink)}.chip{border:1px solid currentColor}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand"><div class="seal">GI<br>088</div><div><div class="eyebrow">Evidence review desk · v2</div><h1>真实对话证据审题包</h1></div></div>
      <div class="top-actions"><button class="btn" id="showCompareButton">两题对比 · <span id="compareCount">0</span>/2</button><button class="btn" id="importButton">导入草稿</button><button class="btn" id="draftButton">导出草稿</button><button class="btn primary" id="finalButton">完成并导出</button><input class="hidden" id="importInput" type="file" accept="application/json"></div>
    </header>
    <section class="truth">
      <div class="warning"><strong>v1 已撤回</strong><small>旧页只能查看资产目录，真实对话证据不完整，停止产品裁决。</small></div>
      <div><strong id="reviewableCount">12</strong><small>份真实对话证据<br>覆盖原资产 8 项</small></div>
      <div><strong id="pendingCount">54</strong><small>项原资产材料待补</small></div>
      <div><strong id="outCount">8</strong><small>项原资产当前范围外</small></div>
      <div><strong id="progressCount">0 / 12</strong><small>已完成真实对话裁决</small></div>
    </section>
    <nav class="tabs" aria-label="证据分区"><button class="tab active" data-tab="reviewable">可以直接评 · 12</button><button class="tab" data-tab="pending">材料待补 · 54</button><button class="tab" data-tab="out">当前范围外 · 8</button><span class="progress" id="saveStatus">尚未填写</span></nav>
    <main class="workspace">
      <aside class="list-panel"><div class="list-tools"><input id="search" class="search" type="search" placeholder="搜索编号、标题或原话" aria-label="搜索"><div class="filters"><select id="goldFilter" aria-label="历史标签"><option value="all">全部历史标签</option><option value="direct_use">可直接使用</option><option value="minor_issue">轻微问题</option><option value="quality_failure">质量失败</option><option value="single_case_blocker">单例阻断</option></select><select id="statusFilter" aria-label="评审状态"><option value="all">全部状态</option><option value="todo">待评</option><option value="done">已评</option><option value="blocked">程序拦截</option></select></div></div><div id="caseList" class="case-list"></div></aside>
      <section id="evidence" class="evidence" aria-live="polite"></section>
      <aside id="reviewPanel" class="review-panel"></aside>
    </main>
  </div>
  <div id="compareDrawer" class="compare-drawer hidden" role="dialog" aria-modal="true" aria-labelledby="compareTitle"><div class="compare-sheet"><div class="compare-head"><h2 id="compareTitle">两份真实回答并排比较</h2><button class="btn" id="closeCompareButton">关闭</button></div><div id="compareGrid" class="compare-grid"></div></div></div>
  <div id="toast" role="status"></div>
  <script id="packet" type="application/json">__GI088_REAL_CONVERSATION_PACKET__</script>
  <script>
    const packet=JSON.parse(document.getElementById("packet").textContent);
    const storageKey="daily-light:gi088-real-conversation-review:"+packet.reviewPacketFingerprint;
    const labels={direct_use:"可直接使用",minor_issue:"轻微问题",quality_failure:"质量失败",single_case_blocker:"单例阻断",unreviewed:"未评",valid:"有效",protected_failure:"程序拦截"};
    const dispositions={keep:"保留",modify_gold:"修改金标",add_context:"补充上下文",development_only:"转开发探索",retire_replace:"退出替换",await_product_rule:"等待产品规则决定"};
    let state={tab:"reviewable",activeId:packet.reviewableCases[0].reviewId,answers:{},revisions:{},compare:[],updatedAt:null};
    let saved=localStorage.getItem(storageKey);if(saved){try{state={...state,...JSON.parse(saved)}}catch{}}
    const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    function toast(text){const el=$("#toast");el.textContent=text;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
    function persist(){state.updatedAt=new Date().toISOString();localStorage.setItem(storageKey,JSON.stringify(state));$("#saveStatus").textContent="已自动保存 · "+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});updateProgress()}
    function updateProgress(){const done=packet.reviewableCases.filter(c=>state.answers[c.reviewId]?.finalDisposition).length;$("#progressCount").textContent=done+" / "+packet.reviewableCases.length;$("#compareCount").textContent=state.compare.length}
    function current(){return packet.reviewableCases.find(c=>c.reviewId===state.activeId)||packet.reviewableCases[0]}
    function filteredCases(){const q=$("#search").value.trim().toLowerCase(),gold=$("#goldFilter").value,status=$("#statusFilter").value;return packet.reviewableCases.filter(c=>{const hay=(c.reviewId+c.sourceCaseId+c.title+c.transcript.map(m=>m.content).join(" ")).toLowerCase();const done=Boolean(state.answers[c.reviewId]?.finalDisposition);return(!q||hay.includes(q))&&(gold==="all"||c.historicalGold===gold)&&(status==="all"||(status==="todo"&&!done)||(status==="done"&&done)||(status==="blocked"&&c.deliveryStatus==="generated_but_program_blocked"))})}
    function renderList(){let items=state.tab==="reviewable"?filteredCases():state.tab==="pending"?packet.pendingAssets:packet.outOfScopeAssets;$("#caseList").innerHTML=items.map((c,i)=>{const id=c.reviewId||c.assetId;const active=id===state.activeId;const done=Boolean(state.answers[id]?.finalDisposition);return `<button class="case-row ${active?"active":""}" data-id="${esc(id)}"><div class="case-top"><span class="case-id">${esc(id)}</span><span class="done-dot ${done?"done":""}"></span></div><div class="case-title">${esc(c.title)}</div><div class="chips">${c.historicalGold?`<span class="chip gold">${esc(labels[c.historicalGold]||c.historicalGold)}</span>`:""}${c.deliveryStatus==="generated_but_program_blocked"?'<span class="chip blocked">程序拦截</span>':""}<span class="chip">${esc(c.assetGroup||c.sourceCaseId||"")}</span></div></button>`}).join("")||'<div class="empty">没有符合条件的材料</div>';document.querySelectorAll(".case-row").forEach(el=>el.addEventListener("click",()=>{state.activeId=el.dataset.id;render()}))}
    function sourceRows(identity){return Object.entries(identity).map(([k,v])=>`<div class="source-row"><span>${esc(k)}</span><span class="mono">${esc(Array.isArray(v)?v.join(", "):v)}</span></div>`).join("")}
    function renderEvidence(c){const messages=c.transcript.map(m=>`<article class="message ${m.role} ${m.isTarget?"target":""}"><div class="speaker">${m.role==="user"?"用户原话":"AI 当时的回答"}${m.isTarget&&m.deliveryStatus==="generated_but_program_blocked"?" · 模型生成后被程序拦截":""}</div>${esc(m.content)}</article>`).join("");$("#evidence").innerHTML=`<div class="evidence-header"><div class="kicker">${esc(c.reviewId)} · ${esc(c.sourceCaseId)} · 局部对话动作</div><h2>${esc(c.title)}</h2><div class="status-line"><span class="chip gold">历史金标：${esc(labels[c.historicalGold]||c.historicalGold)}</span><span class="chip ${c.deliveryStatus==="generated_but_program_blocked"?"blocked":""}">${c.deliveryStatus==="visible_to_user"?"用户实际看到":"模型生成，程序拦截"}</span><span class="chip">${esc(labels[c.technicalStatus]||c.technicalStatus)}</span></div></div><div class="notice"><strong>证据边界：</strong>${esc(c.knownLimitation)}</div><div class="transcript">${messages}</div><div class="evidence-grid"><section class="evidence-card"><h3>历史人工结论</h3><div class="label-value">${esc(labels[c.originalRunReview.label]||c.originalRunReview.label)}</div><p>${esc(c.originalRunReview.reason)}</p><p class="mono">${esc(c.originalRunReview.reviewedAt||"原记录未写评审时间")}</p></section><section class="evidence-card"><h3>后来形成的金标依据</h3><p><strong>为什么收录：</strong>${esc(c.currentGoldRationale.whyAdded)}</p><p><strong>期待动作：</strong>${esc(c.currentGoldRationale.expectedBehavior)}</p><p><strong>禁区：</strong>${esc(c.currentGoldRationale.prohibitedBehavior.join("；")||"原记录未列禁区")}</p></section><section class="evidence-card wide"><h3>来源与运行身份</h3>${sourceRows(c.sourceIdentity)}<div class="source-row"><span>对话内容指纹</span><span class="mono">${esc(c.conversationFingerprint)}</span></div><div class="source-row"><span>关联原资产</span><span class="mono">${esc(c.linkedAssetIds.join("、")||"未直接绑定原 70 项")}</span></div></section></div>`}
    const questions=[
      ["representative","场景真实、有代表性吗？",[["yes","是"],["edge","边缘但必要"],["no","否"]]],
      ["contextSufficient","上下文足以理解 AI 为什么这样回答吗？",[["yes","足够"],["no","不足"],["ambiguous","两种解释"]]],
      ["responseComplete","这段 AI 回答完整可见吗？",[["yes","完整"],["no","不完整"]]],
      ["constructClear","主要考点清楚吗？",[["yes","清楚"],["mixed","考点混杂"],["wrong","考错对象"]]],
      ["historicalLabelValid","历史质量标签合理吗？",[["yes","合理"],["no","需修改"],["uncertain","待定"]]],
      ["blockerLevelValid","历史阻断级别合理吗？",[["yes","合理"],["too_high","过高"],["too_low","过低"],["na","不适用"]]],
      ["evidenceLayer","适合放在哪一层？",[["local_action","局部动作"],["complete_trajectory","完整轨迹"],["user_experience","用户体验"]]]
    ];
    function renderReview(c){const a=state.answers[c.reviewId]||{};const blocks=questions.map(([name,title,options])=>`<fieldset class="question"><legend>${title}</legend><div class="radio-grid">${options.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${a[name]===v?"checked":""}>${l}</label>`).join("")}</div></fieldset>`).join("");$("#reviewPanel").innerHTML=`<h3>你的裁决</h3><p>历史标签从一开始可见。这里判断这份真实对话和旧金标是否值得进入正式评测资产。</p>${blocks}<div class="field"><label for="finalDisposition">最终处置</label><select id="finalDisposition"><option value="">请选择</option>${Object.entries(dispositions).map(([v,l])=>`<option value="${v}" ${a.finalDisposition===v?"selected":""}>${l}</option>`).join("")}</select></div><div class="field ${a.finalDisposition==="modify_gold"?"":"hidden"}" id="newGoldField"><label for="newGold">新质量标签</label><select id="newGold"><option value="">请选择</option>${["direct_use","minor_issue","quality_failure","single_case_blocker"].map(v=>`<option value="${v}" ${a.newGold===v?"selected":""}>${labels[v]}</option>`).join("")}</select></div><div class="field"><label for="reason">依据与修改要求</label><textarea id="reason" placeholder="修改金标、补上下文或退出时必须说明理由">${esc(a.reason||"")}</textarea></div><div class="savebar"><button class="btn" id="compareButton">加入对比</button><button class="btn primary" id="saveNextButton">保存并看下一份</button></div>`;$("#finalDisposition").addEventListener("change",e=>$("#newGoldField").classList.toggle("hidden",e.target.value!=="modify_gold"));$("#saveNextButton").addEventListener("click",()=>saveCurrent(c));$("#compareButton").addEventListener("click",()=>{if(!state.compare.includes(c.reviewId))state.compare.push(c.reviewId);if(state.compare.length>2)state.compare.shift();persist();toast("已加入对比（"+state.compare.length+"/2）")})}
    function collect(){const a={};questions.forEach(([name])=>{a[name]=document.querySelector(`input[name="${name}"]:checked`)?.value||""});a.finalDisposition=$("#finalDisposition")?.value||"";a.newGold=$("#newGold")?.value||"";a.reason=$("#reason")?.value.trim()||"";return a}
    function saveCurrent(c){const next=collect();const missing=questions.filter(([name])=>!next[name]).map(([,title])=>title);if(!next.finalDisposition)missing.push("最终处置");if(next.finalDisposition==="modify_gold"&&!next.newGold)missing.push("新质量标签");if((next.finalDisposition!=="keep"||next.historicalLabelValid==="no")&&!next.reason)missing.push("依据与修改要求");if(missing.length){toast("还需填写："+missing[0]);return}const previous=state.answers[c.reviewId];state.answers[c.reviewId]={...next,reviewedAt:new Date().toISOString()};state.revisions[c.reviewId]=state.revisions[c.reviewId]||[];state.revisions[c.reviewId].push({revision:state.revisions[c.reviewId].length+1,previous:previous||null,current:state.answers[c.reviewId]});persist();const cases=filteredCases();const i=cases.findIndex(x=>x.reviewId===c.reviewId);state.activeId=(cases[i+1]||cases[0]).reviewId;render();toast("已保存")}
    function renderNonReview(){const list=state.tab==="pending"?packet.pendingAssets:packet.outOfScopeAssets;$("#evidence").innerHTML=`<div class="nonreview"><div class="evidence-header"><div class="kicker">${state.tab==="pending"?"Evidence pending":"Outside current scope"}</div><h2>${state.tab==="pending"?"材料待补":"当前范围外"}</h2><p>${state.tab==="pending"?"这些原资产保留身份和缺口，但当前不能提交“保留为正式评测案例”的裁决。":"这些材料属于【帮我记】或跨模式检查，本轮【陪我聊】评审不计算。"}</p></div>${list.map(c=>`<article class="item"><div class="chips"><span class="chip">${esc(c.assetId)}</span><span class="chip">${esc(c.assetGroup)}</span></div><h3>${esc(c.title)}</h3><p>${esc(c.whyBlocked||c.reason)}</p>${c.missingEvidence?`<div class="missing">${c.missingEvidence.map(x=>`<span>缺 ${esc(x)}</span>`).join("")}</div>`:""}</article>`).join("")}</div>`;$("#reviewPanel").innerHTML='<h3>当前不可裁决</h3><p>补齐真实用户原话、AI 实际回答、运行身份和历史人工结论后，才会进入“可以直接评”。</p>'}
    function showCompare(){const selected=state.compare.map(id=>packet.reviewableCases.find(c=>c.reviewId===id)).filter(Boolean);$("#compareGrid").innerHTML=selected.length?selected.map(c=>`<article class="compare-card"><div class="chips"><span class="chip">${esc(c.reviewId)}</span><span class="chip gold">${esc(labels[c.historicalGold]||c.historicalGold)}</span></div><h3>${esc(c.title)}</h3><div class="compare-answer">${esc(c.targetResponse)}</div><p><strong>历史理由：</strong>${esc(c.originalRunReview.reason)}</p><p class="mono">${esc(c.conversationFingerprint)}</p></article>`).join(""):'<div class="compare-empty">先在题目右侧点击“加入对比”，最多选择两份。</div>';$("#compareDrawer").classList.remove("hidden");$("#closeCompareButton").focus()}
    function render(){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===state.tab));if(state.tab==="reviewable"){if(!packet.reviewableCases.some(c=>c.reviewId===state.activeId))state.activeId=packet.reviewableCases[0].reviewId;renderList();renderEvidence(current());renderReview(current())}else{renderList();renderNonReview()}updateProgress()}
    function documentValue(status){return{schemaVersion:"2.0",packageVersion:packet.packageVersion,reviewPacketFingerprint:packet.reviewPacketFingerprint,status,exportedAt:new Date().toISOString(),answers:state.answers,revisions:state.revisions}}
    function download(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
    function markdown(doc){const lines=["# GI-088 真实对话证据审题结果","",`- 评审包：${doc.reviewPacketFingerprint}`,`- 完成：${Object.keys(doc.answers).length} / ${packet.reviewableCases.length}`,""];packet.reviewableCases.forEach(c=>{const a=doc.answers[c.reviewId];lines.push(`## ${c.reviewId}｜${c.title}`,"",`- 历史金标：${labels[c.historicalGold]}`,`- 最终处置：${dispositions[a.finalDisposition]}`,`- 新金标：${a.newGold?labels[a.newGold]:"未修改"}`,`- 理由：${a.reason||"保留原定位"}`,"")});return lines.join("\n")}
    $("#showCompareButton").addEventListener("click",showCompare);$("#closeCompareButton").addEventListener("click",()=>$("#compareDrawer").classList.add("hidden"));$("#compareDrawer").addEventListener("click",e=>{if(e.target.id==="compareDrawer")$("#compareDrawer").classList.add("hidden")});$("#draftButton").addEventListener("click",()=>download("gi088-real-conversation-review-v2-draft.json",JSON.stringify(documentValue("draft"),null,2)+"\n","application/json"));$("#finalButton").addEventListener("click",()=>{const missing=packet.reviewableCases.filter(c=>!state.answers[c.reviewId]?.finalDisposition);if(missing.length){toast("还有 "+missing.length+" 份真实对话未完成");state.tab="reviewable";state.activeId=missing[0].reviewId;render();return}const doc=documentValue("review_complete");download("gi088-real-conversation-review-v2-decisions.json",JSON.stringify(doc,null,2)+"\n","application/json");download("gi088-real-conversation-review-v2-summary.md",markdown(doc),"text/markdown")});$("#importButton").addEventListener("click",()=>$("#importInput").click());$("#importInput").addEventListener("change",async e=>{const file=e.target.files[0];if(!file)return;try{const doc=JSON.parse(await file.text());if(doc.reviewPacketFingerprint!==packet.reviewPacketFingerprint)throw new Error("fingerprint");state.answers=doc.answers||{};state.revisions=doc.revisions||{};persist();render();toast("草稿已导入")}catch{toast("导入失败：评审包指纹不匹配或文件无效")}e.target.value=""});document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{state.tab=t.dataset.tab;state.activeId=state.tab==="reviewable"?packet.reviewableCases[0].reviewId:(state.tab==="pending"?packet.pendingAssets[0].assetId:packet.outOfScopeAssets[0].assetId);render()}));["search","goldFilter","statusFilter"].forEach(id=>$("#"+id).addEventListener(id==="search"?"input":"change",renderList));document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#compareDrawer").classList.add("hidden");if((e.metaKey||e.ctrlKey)&&e.key==="s"){e.preventDefault();if(state.tab==="reviewable")saveCurrent(current())}if(e.altKey&&["ArrowDown","ArrowUp"].includes(e.key)&&state.tab==="reviewable"){e.preventDefault();const cases=filteredCases(),i=cases.findIndex(c=>c.reviewId===state.activeId),n=e.key==="ArrowDown"?i+1:i-1;state.activeId=(cases[(n+cases.length)%cases.length]||cases[0]).reviewId;render()}});render();
  </script>
</body>
